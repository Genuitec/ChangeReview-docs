name: Deploy redirects to GitHub Pages

# This site has moved to https://genuitec.github.io/eclipse-ai-tools/.
# The pages published here only redirect old links there; see tools/make_redirects.py.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Generate redirect pages
        run: python3 tools/make_redirects.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirects

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
